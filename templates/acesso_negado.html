<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Acesso Negado</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <style>
      body {
        background-color: #0f0f0f;
        color: white;
        font-family: "Segoe UI", sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        text-align: center;
      }

      .box {
        background: #1a1a1a;
        padding: 30px;
        border-radius: 12px;
        border-left: 6px solid #ff444f;
        box-shadow: 0 0 20px rgba(255, 68, 79, 0.2);
        max-width: 420px;
        animation: fadeIn 0.4s ease-in-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      h1 {
        color: #ff444f;
        font-size: 24px;
        margin-bottom: 10px;
      }

      p {
        color: #ccc;
        font-size: 15px;
        margin-bottom: 14px;
        line-height: 1.5;
      }

      a {
        color: #00d67b;
        text-decoration: none;
        font-weight: bold;
      }

      a:hover {
        text-decoration: underline;
      }

      .emoji {
        font-size: 36px;
        margin-bottom: 10px;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="emoji">🚫</div>
      <h1>Acesso Negado</h1>
      <p>Este dispositivo ou IP ainda não foi autorizado para essa licença.</p>
      <p>
        Se você acredita que isso é um engano,<br />
        <a href="mailto:pglucas7@gmail.com"
          >clique aqui para falar com o suporte</a
        >.
      </p>
    </div>
  </body>
</html>
