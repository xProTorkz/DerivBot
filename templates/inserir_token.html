<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <title>Inserir Token Deriv</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h2>🚀 Primeiro acesso: Cole seu token da Deriv</h2>

      <form id="form-token" method="POST" action="/inserir_token">
        <label for="token">
          Cole aqui o seu token (com permissão de leitura e trade):
        </label>
        <input type="text" id="token" name="token" required />
        <button type="submit" onclick="salvarToken()">Salvar e iniciar</button>
      </form>
    </div>

    <script>
      // Se já tiver token salvo no navegador, envia automaticamente
      window.onload = () => {
        const tokenSalvo = localStorage.getItem("token_deriv");

        if (window.location.pathname === "/token" && tokenSalvo) {
          const form = document.createElement("form");
          form.method = "POST";
          form.action = "/inserir_token";

          const input = document.createElement("input");
          input.type = "hidden";
          input.name = "token";
          input.value = tokenSalvo;

          form.appendChild(input);
          document.body.appendChild(form);
          form.submit();
        }
      };

      // Salva o token no localStorage e envia o formulário normal
      function salvarToken() {
        const token = document.getElementById("token").value;
        localStorage.setItem("token_deriv", token);
        // O botão já é type="submit", então o formulário vai automaticamente
      }
    </script>
  </body>
</html>
