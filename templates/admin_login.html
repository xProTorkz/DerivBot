<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DerivBot - Login de Administrador</title>
    <style>
      :root {
        --cor-primaria: #2c3e50;
        --cor-secundaria: #3498db;
        --cor-destaque: #e74c3c;
        --cor-fundo: #ecf0f1;
        --cor-texto: #2c3e50;
        --cor-borda: #bdc3c7;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--cor-fundo);
        color: var(--cor-texto);
        line-height: 1.6;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        padding: 20px;
      }

      .login-container {
        width: 100%;
        max-width: 400px;
        padding: 30px;
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 2px 20px rgba(0, 0, 0, 0.1);
      }

      h1 {
        color: var(--cor-primaria);
        margin-bottom: 20px;
        text-align: center;
      }

      .form-group {
        margin-bottom: 20px;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-weight: bold;
      }

      input {
        width: 100%;
        padding: 12px;
        border: 1px solid var(--cor-borda);
        border-radius: 4px;
        font-size: 16px;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: var(--cor-secundaria);
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 16px;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #2980b9;
      }

      .alert {
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 4px;
        background-color: #fadbd8;
        color: #c0392b;
        border: 1px solid #e74c3c;
      }

      .logo {
        text-align: center;
        margin-bottom: 20px;
      }

      .logo img {
        max-width: 200px;
        height: auto;
      }

      .help-text {
        margin-top: 20px;
        text-align: center;
        font-size: 14px;
        color: #7f8c8d;
      }

      .help-text a {
        color: var(--cor-secundaria);
        text-decoration: none;
      }

      .help-text a:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="logo">
        <h2>DerivBot</h2>
        <p>Painel de Administração</p>
      </div>

      <h1>Login</h1>

      {% if erro %}
      <div class="alert">{{ erro }}</div>
      {% endif %}

      <form action="/admin/login" method="POST">
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required />
        </div>

        <div class="form-group">
          <label for="senha">Senha:</label>
          <input type="password" id="senha" name="senha" required />
        </div>

        <button type="submit">Entrar</button>
      </form>

      <div class="help-text">
        <p>Acesso restrito a administradores.</p>
        <p>
          Esqueceu sua senha? <a href="/admin/recuperar-senha">Clique aqui</a>
        </p>
      </div>
    </div>
  </body>
</html>
