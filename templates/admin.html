<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Administração - DerivBot</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <style>
      :root {
        --primary-color: #2c3e50;
        --secondary-color: #3498db;
        --accent-color: #e74c3c;
        --success-color: #2ecc71;
        --warning-color: #f1c40f;
        --danger-color: #e74c3c;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f8f9fa;
      }

      .sidebar {
        background-color: var(--primary-color);
        color: white;
        min-height: 100vh;
        padding: 20px;
      }

      .sidebar-header {
        padding: 20px 0;
        text-align: center;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      }

      .sidebar-header img {
        width: 60px;
        margin-bottom: 10px;
      }

      .nav-link {
        color: rgba(255, 255, 255, 0.8);
        padding: 10px 15px;
        border-radius: 5px;
        margin-bottom: 5px;
        transition: all 0.3s ease;
      }

      .nav-link:hover {
        color: white;
        background-color: rgba(255, 255, 255, 0.1);
      }

      .nav-link.active {
        color: white;
        background-color: var(--secondary-color);
      }

      .main-content {
        padding: 20px;
      }

      .card {
        border: none;
        border-radius: 10px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        margin-bottom: 20px;
      }

      .card-header {
        background-color: white;
        border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        padding: 15px 20px;
      }

      .btn-action {
        padding: 8px 15px;
        border-radius: 5px;
        font-weight: 500;
        transition: all 0.3s ease;
      }

      .btn-primary {
        background-color: var(--secondary-color);
        color: white;
      }

      .btn-danger {
        background-color: var(--danger-color);
        color: white;
      }

      .table {
        margin-bottom: 0;
      }

      .table th {
        border-top: none;
        font-weight: 600;
      }

      .modal-content {
        border-radius: 10px;
        border: none;
      }

      .modal-header {
        background-color: var(--primary-color);
        color: white;
        border-radius: 10px 10px 0 0;
      }

      .form-control {
        border-radius: 5px;
        border: 1px solid #dee2e6;
        padding: 10px 15px;
      }

      .form-control:focus {
        border-color: var(--secondary-color);
        box-shadow: 0 0 0 0.2rem rgba(52, 152, 219, 0.25);
      }

      .notification {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 15px 20px;
        border-radius: 5px;
        color: white;
        display: none;
        z-index: 1000;
      }

      .notification-success {
        background-color: var(--success-color);
      }

      .notification-error {
        background-color: var(--danger-color);
      }
    </style>
  </head>
  <body>
    <div class="container-fluid">
      <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar">
          <div class="sidebar-header">
            <img src="/static/img/logo.png" alt="DerivBot Logo" />
            <h5>DerivBot Admin</h5>
          </div>
          <nav class="mt-4">
            <a href="#" class="nav-link active">
              <i class="fas fa-users me-2"></i> Usuários
            </a>
            <a href="#" class="nav-link">
              <i class="fas fa-key me-2"></i> Licenças
            </a>
            <a href="#" class="nav-link">
              <i class="fas fa-chart-bar me-2"></i> Estatísticas
            </a>
            <a href="#" class="nav-link">
              <i class="fas fa-cog me-2"></i> Configurações
            </a>
            <a href="/logout" class="nav-link">
              <i class="fas fa-sign-out-alt me-2"></i> Sair
            </a>
          </nav>
        </div>

        <!-- Main Content -->
        <div class="col-md-9 col-lg-10 main-content">
          <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gerenciamento de Usuários</h2>
            <button
              class="btn btn-action btn-primary"
              data-bs-toggle="modal"
              data-bs-target="#addUserModal"
            >
              <i class="fas fa-plus me-2"></i>Novo Usuário
            </button>
          </div>

          <!-- Users Table -->
          <div class="card">
            <div class="card-header">
              <h5 class="mb-0">Lista de Usuários</h5>
            </div>
            <div class="card-body">
              <div class="table-responsive">
                <table class="table">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>Nome</th>
                      <th>Email</th>
                      <th>Plano</th>
                      <th>Status</th>
                      <th>Data de Registro</th>
                      <th>Ações</th>
                    </tr>
                  </thead>
                  <tbody id="usersTable">
                    <!-- Será preenchido via JavaScript -->
                  </tbody>
                </table>
              </div>
            </div>
          </div>

          <!-- Statistics Cards -->
          <div class="row mt-4">
            <div class="col-md-3">
              <div class="card">
                <div class="card-body text-center">
                  <i class="fas fa-users fa-2x mb-3 text-primary"></i>
                  <h3 id="totalUsers">0</h3>
                  <p class="text-muted">Total de Usuários</p>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="card">
                <div class="card-body text-center">
                  <i class="fas fa-check-circle fa-2x mb-3 text-success"></i>
                  <h3 id="activeUsers">0</h3>
                  <p class="text-muted">Usuários Ativos</p>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="card">
                <div class="card-body text-center">
                  <i class="fas fa-key fa-2x mb-3 text-warning"></i>
                  <h3 id="totalLicenses">0</h3>
                  <p class="text-muted">Licenças Emitidas</p>
                </div>
              </div>
            </div>
            <div class="col-md-3">
              <div class="card">
                <div class="card-body text-center">
                  <i class="fas fa-dollar-sign fa-2x mb-3 text-danger"></i>
                  <h3 id="totalRevenue">R$ 0</h3>
                  <p class="text-muted">Receita Total</p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Add User Modal -->
    <div class="modal fade" id="addUserModal" tabindex="-1">
      <div class="modal-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h5 class="modal-title">Adicionar Novo Usuário</h5>
            <button
              type="button"
              class="btn-close"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body">
            <form id="addUserForm">
              <div class="mb-3">
                <label for="userName" class="form-label">Nome</label>
                <input
                  type="text"
                  class="form-control"
                  id="userName"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="userEmail" class="form-label">Email</label>
                <input
                  type="email"
                  class="form-control"
                  id="userEmail"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="userPlan" class="form-label">Plano</label>
                <select class="form-control" id="userPlan" required>
                  <option value="basic">Básico</option>
                  <option value="premium">Premium</option>
                  <option value="pro">Pro</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="licenseDuration" class="form-label"
                  >Duração da Licença (meses)</label
                >
                <input
                  type="number"
                  class="form-control"
                  id="licenseDuration"
                  min="1"
                  max="12"
                  value="1"
                  required
                />
              </div>
            </form>
          </div>
          <div class="modal-footer">
            <button
              type="button"
              class="btn btn-secondary"
              data-bs-dismiss="modal"
            >
              Cancelar
            </button>
            <button type="button" class="btn btn-primary" id="saveUserBtn">
              Salvar
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- Notification -->
    <div class="notification" id="notification"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
      // Funções de atualização
      function updateUsers() {
        fetch("/api/admin/users")
          .then((response) => response.json())
          .then((data) => {
            const tableBody = document.getElementById("usersTable");
            tableBody.innerHTML = data.users
              .map(
                (user) => `
                        <tr>
                            <td>${user.id}</td>
                            <td>${user.name}</td>
                            <td>${user.email}</td>
                            <td>${user.plan}</td>
                            <td>
                                <span class="badge ${
                                  user.active ? "bg-success" : "bg-danger"
                                }">
                                    ${user.active ? "Ativo" : "Inativo"}
                                </span>
                            </td>
                            <td>${new Date(
                              user.registration_date
                            ).toLocaleDateString()}</td>
                            <td>
                                <button class="btn btn-sm btn-primary me-2" onclick="editUser(${
                                  user.id
                                })">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteUser(${
                                  user.id
                                })">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </td>
                        </tr>
                    `
              )
              .join("");

            // Atualiza estatísticas
            document.getElementById("totalUsers").textContent =
              data.stats.total_users;
            document.getElementById("activeUsers").textContent =
              data.stats.active_users;
            document.getElementById("totalLicenses").textContent =
              data.stats.total_licenses;
            document.getElementById(
              "totalRevenue"
            ).textContent = `R$ ${data.stats.total_revenue.toFixed(2)}`;
          })
          .catch((error) =>
            showNotification("Erro ao carregar usuários", "error")
          );
      }

      // Funções de controle
      document.getElementById("saveUserBtn").addEventListener("click", () => {
        const userData = {
          name: document.getElementById("userName").value,
          email: document.getElementById("userEmail").value,
          plan: document.getElementById("userPlan").value,
          license_duration: parseInt(
            document.getElementById("licenseDuration").value
          ),
        };

        fetch("/api/admin/users", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify(userData),
        })
          .then((response) => response.json())
          .then((data) => {
            if (data.success) {
              showNotification("Usuário adicionado com sucesso", "success");
              bootstrap.Modal.getInstance(
                document.getElementById("addUserModal")
              ).hide();
              updateUsers();
            } else {
              showNotification(data.message, "error");
            }
          })
          .catch((error) =>
            showNotification("Erro ao adicionar usuário", "error")
          );
      });

      function editUser(userId) {
        // Implementar edição de usuário
        showNotification("Funcionalidade em desenvolvimento", "warning");
      }

      function deleteUser(userId) {
        if (confirm("Tem certeza que deseja excluir este usuário?")) {
          fetch(`/api/admin/users/${userId}`, {
            method: "DELETE",
          })
            .then((response) => response.json())
            .then((data) => {
              if (data.success) {
                showNotification("Usuário excluído com sucesso", "success");
                updateUsers();
              } else {
                showNotification(data.message, "error");
              }
            })
            .catch((error) =>
              showNotification("Erro ao excluir usuário", "error")
            );
        }
      }

      // Função de notificação
      function showNotification(message, type) {
        const notification = document.getElementById("notification");
        notification.textContent = message;
        notification.className = `notification notification-${type}`;
        notification.style.display = "block";

        setTimeout(() => {
          notification.style.display = "none";
        }, 3000);
      }

      // Inicialização
      updateUsers();
    </script>
  </body>
</html>
