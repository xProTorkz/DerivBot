<!-- templates/historico_completo.html -->
<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Histórico Completo</title>
    <link rel="stylesheet" href="/static/style.css" />
    <style>
      .resumo-box {
        background: #1f1f1f;
        padding: 20px;
        border-radius: 12px;
        margin-bottom: 30px;
        box-shadow: 0 0 10px rgba(255, 255, 255, 0.05);
      }
      .resumo-box h3 {
        margin-bottom: 10px;
        color: #32cd32;
      }
      .resumo-item {
        margin-bottom: 8px;
        font-size: 16px;
      }
    </style>
  </head>
  <body>
    <div class="top-bar">
      <a href="/painel" class="logout-btn">Voltar ao Painel</a>
    </div>

    <div class="historico glass-dark">
      <h2 style="text-align: center">Histórico Completo</h2>

      <div class="resumo-box">
        <h3>Resumo Geral</h3>
        <div class="resumo-item">
          Total de Operações: <span id="total-operacoes">--</span>
        </div>
        <div class="resumo-item">
          Assertividade: <span id="percentual-acerto">--%</span>
        </div>
        <div class="resumo-item">
          Lucro Total: <span id="lucro-total">$--</span>
        </div>
        <div class="resumo-item">
          Prejuízo Total: <span id="prejuizo-total">$--</span>
        </div>
      </div>

      <div class="tabela-wrapper">
        <table id="historico-completo-tabela">
          <thead>
            <tr>
              <th>Data</th>
              <th>Hora</th>
              <th>Modo</th>
              <th>Resultado</th>
              <th>Valor</th>
              <th>Lucro / Prejuízo</th>
            </tr>
          </thead>
          <tbody id="historico-completo-body">
            <!-- Conteúdo dinâmico -->
          </tbody>
        </table>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", function () {
        fetch("/historico_resultados")
          .then((res) => res.json())
          .then((data) => {
            const corpo = document.getElementById("historico-completo-body");
            const total = data.length;
            let ganhos = 0,
              perdas = 0,
              lucroTotal = 0,
              prejuizoTotal = 0;

            data.reverse().forEach((item) => {
              const linha = document.createElement("tr");
              const resultado = parseFloat(item.resultado_real);
              if (resultado >= 0) {
                ganhos++;
                lucroTotal += resultado;
              } else {
                perdas++;
                prejuizoTotal += resultado;
              }

              linha.innerHTML = `
                <td>${item.data.split(" ")[0]}</td>
                <td>${item.data.split(" ")[1].slice(0, 5)}</td>
                <td>${item.modo || "-"}</td>
                <td>${item.tipo.toUpperCase()}</td>
                <td>$${parseFloat(item.valor).toFixed(2)}</td>
                <td class="${
                  resultado >= 0 ? "positivo" : "negativo"
                }">$${resultado.toFixed(2)}</td>
              `;
              corpo.appendChild(linha);
            });

            document.getElementById("total-operacoes").textContent = total;
            document.getElementById("percentual-acerto").textContent = total
              ? ((ganhos / total) * 100).toFixed(1)
              : "0";
            document.getElementById("lucro-total").textContent =
              "$" + lucroTotal.toFixed(2);
            document.getElementById("prejuizo-total").textContent =
              "$" + prejuizoTotal.toFixed(2);
          });
      });
    </script>
  </body>
</html>
